version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: faceshop-app
    container_name: faceshop-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - faceshop-network

  webserver:
    image: nginx:alpine
    container_name: faceshop-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - faceshop-network

  db:
    image: mysql:8.0
    container_name: faceshop-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-faceshop_laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-faceshop_user}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - faceshop-network

networks:
  faceshop-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
